[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "noter"
version = "0.2.0"
description = "Enregistre, transcrit et résume tes calls — 100 % local"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "sounddevice>=0.4.6",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "anthropic>=1.0",
    "fpdf2>=2.7",
    "faster-whisper>=1.0.0",
    "PySide6>=6.7",
]

[project.optional-dependencies]
mlx = ["mlx-whisper>=0.4"]
diarize = ["pyannote-audio>=3.1"]
mcp = ["mcp>=2.3,<3"]
dev = ["pytest>=8.0", "ruff>=0.5", "mcp>=2.3,<3"]

[project.scripts]
noter = "noter.cli:app"
noter-app = "noter.ui.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"noter.ui" = ["assets/*.png", "assets/*.icns", "assets/fonts/*.ttf", "assets/fonts/OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/noter/cli.py" = ["B008"]
