[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "noter"
version = "0.1.0"
description = "Plaud maison — enregistre, transcrit et résume tes calls automatiquement"
requires-python = ">=3.9"
dependencies = [
    "typer[all]>=0.9.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "scipy>=1.11",
    "faster-whisper>=1.0.0",
    "pyannote-audio>=3.1",
    "anthropic>=0.40",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic-settings>=2.1",
    "rich>=13.0",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0",
    "rumps>=0.4.0",
    "fpdf2>=2.7",
]

[project.optional-dependencies]
mlx = ["mlx-whisper>=0.1"]

[project.scripts]
noter = "noter.cli:app"
noter-app = "noter.app:main"

[tool.setuptools.packages.find]
where = ["src"]
